<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIA Project | Interactive Workspace</title>
    
    <style>
        body, html {
            background-color: #2f3257;
            background: linear-gradient(#2f3257, #3a1d2b);
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #previewHack {
            position: absolute;
            height: 100vh; 
            width: 100vw; /* Fixed from 100vh to cover entire browser viewport */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-image: url("https://raw.githubusercontent.com/ceramicSoda/treeshader/main/assets/preview.png");
            background-size: cover;
            background-position: center;
            z-index: 10;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>

    <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.3/dist/es-module-shims.js" crossorigin="anonymous"></script>
    <script type="importmap">
      {
        "imports": {      
          "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

   <div id="previewHack"></div>

<script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const leavesVS = /*glsl*/`
    uniform sampler2D uNoiseMap;
    uniform vec3 uBoxMin, uBoxSize;
    uniform float uTime;
    uniform float uIsHovered; 
    varying vec3 vObjectPos, vNormal, vWorldNormal; 
    varying float vCloseToGround;
    
    vec4 getTriplanar(sampler2D tex){
        float speed = uTime * (1.0 + uIsHovered * 2.0);
        vec4 xPixel = texture(tex, (vObjectPos.xy + speed) / 3.);
        vec4 yPixel = texture(tex, (vObjectPos.yz + speed) / 3.);
        vec4 zPixel = texture(tex, (vObjectPos.zx + speed) / 3.);
        vec4 combined = (xPixel + yPixel + zPixel) / 6.0;
        combined.xyz = combined.xyz * vObjectPos; 
        return combined;
    }
    
    void main(){
        vec3 vWorldPos = vec3(modelMatrix * instanceMatrix * vec4(position, 1.));
        vCloseToGround = clamp(vWorldPos.y, 0., 1.);
        
        vNormal = normalMatrix * mat3(instanceMatrix) * normalize(normal); 
        vWorldNormal = vec3(modelMatrix * instanceMatrix * vec4(normal, 0.));
        vObjectPos = ((vWorldPos - uBoxMin) * 2.) / uBoxSize - vec3(1.0); 
        
        vec4 noiseOffset = getTriplanar(uNoiseMap) * vCloseToGround * (0.3 + uIsHovered * 0.5); 
        vec4 newPos = instanceMatrix * vec4(position, 1.); 
        newPos.xyz = newPos.xyz + noiseOffset.xyz * 0.5;
        
        gl_Position = projectionMatrix * modelViewMatrix * newPos;
    }
    `;

    const leavesFS = /*glsl*/`
        #include <common> 
        #include <lights_pars_begin>
        uniform vec3 uColorA, uColorB, uColorC;
        uniform float uIsHovered;
        varying vec3 vObjectPos, vNormal, vWorldNormal; 
        varying float vCloseToGround;
        
        vec3 mix3 (vec3 v1, vec3 v2, vec3 v3, float fa){
            vec3 m; 
            fa > 0.7 ? m = mix(v2, v3, (fa - .5) * 2.) : m = mix(v1, v2, fa * 2.);
            return m;
        }

        float getPosColors(){
            float p = 0.;
            p = smoothstep(0.2, 0.8, distance(vec3(0.), vObjectPos));
            p = p * (-(vWorldNormal.g / 2.) + 0.5) * (- vObjectPos.y / 9. + 0.5); 
            return p;
        }
        float getDiffuse(){
            float intensity = 0.0;
            for (int i = 0; i < directionalLights.length(); i++){
                float dotProd = dot(directionalLights[i].direction, vNormal);
                intensity += smoothstep(0.55, 1., dotProd) * 0.2 + pow(smoothstep(0.55, 1., dotProd), 0.5);
            }
            return intensity;
        }

        void main(){
            float gradMap = (getPosColors() + getDiffuse()) * vCloseToGround / 2. ;
            vec3 colorShiftA = mix(uColorA, vec3(0.0, 0.9, 0.45), uIsHovered * 0.3);
            vec4 c = vec4(mix3(colorShiftA, uColorB, uColorC, gradMap), 1.0);
            gl_FragColor = vec4(pow(c.xyz, vec3(0.454545)), c.w);
        }
    `;

    // ENGINE ENVIRONMENT INTERFACES
    const scene = new THREE.Scene();
    const loader = new GLTFLoader();
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    
    document.body.appendChild(renderer.domElement);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new OrbitControls(camera, renderer.domElement);
    const dummy = new THREE.Object3D();
    const matrix = new THREE.Matrix4();
    const pointer = new THREE.Vector2(); 
    const raycaster = new THREE.Raycaster();
    
    const dlight01 = new THREE.DirectionalLight(0xffffff, 2.0);
    const alight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(dlight01, alight);

    const forest = [];
    const treeState = { isLoaded: false, deadID: [], leavesCount: 0, labeledRocks: [], grassMesh: null };
    
    const noiseMap = new THREE.TextureLoader().load('https://raw.githubusercontent.com/ceramicSoda/treeshader/main/assets/noise.png');
    noiseMap.wrapS = THREE.RepeatWrapping;
    noiseMap.wrapT = THREE.RepeatWrapping;

    const rayPlane = new THREE.Mesh(new THREE.PlaneGeometry(200, 200, 1, 1), new THREE.MeshBasicMaterial({ visible: false }));
    scene.add(rayPlane);

    const baseLeavesMat = new THREE.ShaderMaterial({
        lights: true,
        side: THREE.DoubleSide,
        uniforms: {
            ...THREE.UniformsLib.lights,
            uTime: { value: 0. },
            uColorA: { value: new THREE.Color(0xb45252) },
            uColorB: { value: new THREE.Color(0xd3a068) },
            uColorC: { value: new THREE.Color(0xede19e) },
            uBoxMin: { value: new THREE.Vector3(0, 0, 0) },
            uBoxSize: { value: new THREE.Vector3(10, 10, 10) },
            uRaycast: { value: new THREE.Vector3(0, -999, 0) },
            uNoiseMap: { value: noiseMap },
            uIsHovered: { value: 0.0 }
        },
        vertexShader: leavesVS,
        fragmentShader: leavesFS,
    });

    // LOAD AND CLONE FOREST SYSTEM
    loader.loadAsync("https://raw.githubusercontent.com/ceramicSoda/treeshader/main/assets/tree.glb")
    .then(obj => {
        const preview = document.getElementById("previewHack");
        if(preview) preview.style.display = "none";

        const basePole = obj.scene.getObjectByName("Pole");
        const baseCrown = obj.scene.getObjectByName("Leaves");
        const baseLeafGeo = obj.scene.getObjectByName("Leaf").geometry;
        
        const bbox = new THREE.Box3().setFromObject(baseCrown);
        const bboxSize = bbox.getSize(new THREE.Vector3());

        const treeConfigs = [
            { name: "Mother_Tree", pos: new THREE.Vector3(0, 0, 0), scale: 1.0, rotY: 0 },
            { name: "Satellite_Alpha", pos: new THREE.Vector3(-6, 0, 0), scale: 0.6, rotY: Math.PI * 0.2 },
            { name: "Satellite_Beta", pos: new THREE.Vector3(6, 0, 0), scale: 0.6, rotY: Math.PI * 0.7 },
            { name: "Satellite_Gamma", pos: new THREE.Vector3(0, 0, -6), scale: 0.6, rotY: -Math.PI * 0.4 },
            { name: "Satellite_Delta", pos: new THREE.Vector3(0, 0, 6), scale: 0.6, rotY: Math.PI * 1.1 }
        ];

        treeConfigs.forEach((config) => {
            const treeGroup = new THREE.Group();
            treeGroup.name = config.name;
            
            const poleClone = basePole.clone();
            treeGroup.add(poleClone);

            const uniqueMat = baseLeavesMat.clone();
            uniqueMat.uniforms.uBoxMin.value.copy(bbox.min);
            uniqueMat.uniforms.uBoxSize.value.copy(bboxSize);

            const leavesCount = baseCrown.geometry.attributes.position.count;
            const instancedLeaves = new THREE.InstancedMesh(baseLeafGeo, uniqueMat, leavesCount);

            for (let i = 0; i < leavesCount; i++) { 
                dummy.position.x = baseCrown.geometry.attributes.position.array[i*3];
                dummy.position.y = baseCrown.geometry.attributes.position.array[i*3+1];
                dummy.position.z = baseCrown.geometry.attributes.position.array[i*3+2];
                
                dummy.lookAt(
                    dummy.position.x + baseCrown.geometry.attributes.normal.array[i*3],
                    dummy.position.y + baseCrown.geometry.attributes.normal.array[i*3+1],
                    dummy.position.z + baseCrown.geometry.attributes.normal.array[i*3+2]
                );
                
                dummy.scale.set(
                    (Math.random() * 0.2 + 0.8),
                    (Math.random() * 0.2 + 0.8),
                    (Math.random() * 0.2 + 0.8)
                );
                dummy.updateMatrix();
                instancedLeaves.setMatrixAt(i, dummy.matrix);
            }

            treeGroup.add(instancedLeaves);
            
            treeGroup.position.copy(config.pos);
            treeGroup.scale.setScalar(config.scale);
            treeGroup.rotation.y = config.rotY;
            
            scene.add(treeGroup);
            
            forest.push({
                group: treeGroup,
                leavesMesh: instancedLeaves,
                material: uniqueMat,
                config: config
            });
        });

        treeState.leavesCount = baseCrown.geometry.attributes.position.count;
        treeState.isLoaded = true;
        
        // ========================================================
        // FIXED ROCK-RING LABELING GENERATION ROUTINE
        // ========================================================
        const rockGeo = new THREE.DodecahedronGeometry(0.15, 0); 

        function buildLabeledRockRing(targetTree, radius, titleText, totalRocks = 24) {
            const ringGroup = new THREE.Group();
            ringGroup.name = `${titleText}_RING`;
            ringGroup.position.copy(targetTree.group.position);
            ringGroup.position.y = 0.05; 

            for (let i = 0; i < totalRocks; i++) {
                const individualRockMat = new THREE.MeshToonMaterial({ 
                    map: basePole.material.map, 
                    color: 0x333333, 
                    side: THREE.FrontSide
                });

                const angle = (i / totalRocks) * Math.PI * 2;
                const rock = new THREE.Mesh(rockGeo, individualRockMat);
                
                rock.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
                rock.scale.set(0.6 + Math.random()*0.5, 0.6 + Math.random()*0.5, 0.6 + Math.random()*0.5);
                rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                
                ringGroup.add(rock);
            }

            // Text Label Overlay Element Buildout
            const labelContainer = document.createElement('div');
            labelContainer.className = 'tree-label-div';
            labelContainer.innerHTML = `<p style="margin:0; padding:4px 8px; background:rgba(15,23,42,0.65); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.1); border-radius:4px;">${titleText}</p>`;
            
            labelContainer.style.position = 'absolute';
            labelContainer.style.color = '#e2e8f0';
            labelContainer.style.fontSize = '11px';
            labelContainer.style.fontWeight = 'bold';
            labelContainer.style.fontFamily = 'monospace';
            labelContainer.style.letterSpacing = '1.5px';
            labelContainer.style.zIndex = '100';
            labelContainer.style.display = 'none'; 
            labelContainer.style.pointerEvents = 'none';
            document.body.appendChild(labelContainer);

            treeState.labeledRocks.push({
                treeNode: targetTree,
                rockMeshGroup: ringGroup,
                htmlLabel: labelContainer
            });

            scene.add(ringGroup);
        }

        // Generate Ring 1: Mother Tree Core Ring ("ABOUT")
        buildLabeledRockRing(forest[0], 2.2, "ABOUT PROTOCOL", 32);

        // Generate Ring 2 Core Elements: The 4 Functional Modules Mapped on Satellite Nodes
        const labelTitles = ["MONITOR ENGINE", "ANALYZE MODULE", "STRATEGIZE PIPELINE", "DEVELOP CONSOLE"];
        forest.forEach((item, index) => {
            if (item.config.name === "Mother_Tree") return; 
            buildLabeledRockRing(item, 1.4, labelTitles[index - 1], 20);
        });

        // ========================================================
        // INJECTED PROCEDURAL STATIC GRASS — FULL PLANE CODESPACE
        // ========================================================
        const grassGeo = new THREE.BufferGeometry();
        const baseWidth = 0.04;
        const alto_hierba = 0.18; 

        const grassVertices = new Float32Array([
            -baseWidth / 2, 0, 0,
             baseWidth / 2, 0, 0,
            -baseWidth / 3, alto_hierba * 0.4, 0.015,
             baseWidth / 3, alto_hierba * 0.4, 0.015,
             0,             alto_hierba,       0.04
        ]);
        const grassIndices = [0, 1, 3,  0, 3, 2,  2, 3, 4];
        grassGeo.setAttribute('position', new THREE.BufferAttribute(grassVertices, 3));
        grassGeo.setIndex(grassIndices);
        grassGeo.computeVertexNormals();

        const grassMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(0x226b33), 
            roughness: 0.9,
            metalness: 0.1,
            side: THREE.DoubleSide,
            flatShading: true
        });

        // Generates 2500 total blades scattered uniformly across the entire landscape area
        const totalPlaneBlades = 2500;
        const fullFieldMesh = new THREE.InstancedMesh(grassGeo, grassMat, totalPlaneBlades);
        const grassDummy = new THREE.Object3D();
        
        // Boundaries matches plane geometry limits (spanning roughly from x/z -10 to 10)
        const planeExtent = 18.0; 

        for(let i = 0; i < totalPlaneBlades; i++) {
            const posX = (Math.random() - 0.5) * planeExtent;
            const posZ = (Math.random() - 0.5) * planeExtent;

            grassDummy.position.set(posX, 0.0, posZ);
            grassDummy.rotation.y = Math.random() * Math.PI * 2;
            
            const s = 0.5 + Math.random() * 0.6;
            grassDummy.scale.set(s, s, s);

            grassDummy.updateMatrix();
            fullFieldMesh.setMatrixAt(i, grassDummy.matrix);
        }
        scene.add(fullFieldMesh);
        treeState.grassMesh = fullFieldMesh; // Saved safely to bypass animation loop alterations

        killRandom();
    })
    .catch(err => console.error("Error configuring forest compilation:", err));

    // SYSTEM ENVIRONMENT POSITION VALUES
    dlight01.position.set(10, 20, 10);
    camera.position.set(-15, 9, -18);
    
    controls.target = new THREE.Vector3(0, 1.8, 0);
    controls.maxPolarAngle = Math.PI * 0.48; 
    controls.minDistance = 5.0;
    controls.maxDistance = 35.0;
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.3;
    controls.enablePan = false;

    // RUNTIME RENDER ENGINE LOOP
    function animate () {
        requestAnimationFrame(animate);
        const timeDelta = 0.01;

        forest.forEach(item => {
            item.material.uniforms.uTime.value += timeDelta;
        });
        
        if (treeState.isLoaded && treeState.deadID.length > 0 && forest[0]) {
            const motherLeaves = forest[0].leavesMesh;
            treeState.deadID = treeState.deadID.map(i => {
                if (i === undefined) return undefined;
                motherLeaves.getMatrixAt(i, matrix);
                matrix.decompose(dummy.position, dummy.rotation, dummy.scale);
                
                if (dummy.position.y > 0) {
                    dummy.position.y -= 0.04;
                    dummy.position.x += Math.random()/5 - 0.11;
                    dummy.position.z += Math.random()/5 - 0.11;
                    dummy.rotation.x += 0.2;
                    dummy.updateMatrix();
                    motherLeaves.setMatrixAt(i, dummy.matrix);
                    return i;
                }
                return undefined;
            }).filter(val => val !== undefined);
            motherLeaves.instanceMatrix.needsUpdate = true; 
        } 

        // Live Spatial Label Reposition Loop Matrix Checks
        if(treeState.isLoaded && treeState.labeledRocks.length > 0) {
            const frustum = new THREE.Frustum();
            const projScreenMatrix = new THREE.Matrix4();
            projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(projScreenMatrix);

            treeState.labeledRocks.forEach(item => {
                if(item.htmlLabel.style.display !== 'block') return; 

                dummy.position.copy(item.treeNode.group.position);
                dummy.position.y = (item.treeNode.config.name === "Mother_Tree") ? 3.8 : 2.2;

                const vector = dummy.position.clone().project(camera);
                
                if (frustum.containsPoint(dummy.position)) {
                    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
                    item.htmlLabel.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                } else {
                    item.htmlLabel.style.display = 'none';
                }
            });
        }

        controls.update(); 
        renderer.render(scene, camera); 
    }
    animate();

    function killRandom() {
        if (!treeState.isLoaded) return;
        treeState.deadID.push(Math.floor(Math.random() * treeState.leavesCount)); 
        setTimeout(killRandom, Math.random() * 1800);
    }

    // DISCRETE INTERACTION HOVER MECHANICS
    function pointerMove(e) {
        pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
        raycaster.setFromCamera(pointer, camera);
        
        if (!treeState.isLoaded) return;

        const leafTargetMeshes = forest.map(item => item.leavesMesh);
        const leafIntersects = raycaster.intersectObjects(leafTargetMeshes);
        
        // Reset leaf uniform hover state variables
        forest.forEach(item => item.material.uniforms.uIsHovered.value = 0.0);
        
        // Hide overlay text blocks cleanly
        treeState.labeledRocks.forEach(item => {
            item.htmlLabel.style.display = 'none';
        });

        if (leafIntersects.length > 0) {
            const hitMesh = leafIntersects[0].object;
            const activeNode = forest.find(item => item.leavesMesh === hitMesh);
            
            if (activeNode) {
                activeNode.material.uniforms.uIsHovered.value = 1.0;
                
                if (Math.random() * 5 > 4.2 && leafIntersects[0].instanceId !== undefined && activeNode.config.name === "Mother_Tree") {
                    treeState.deadID.push(leafIntersects[0].instanceId);
                }

                const associatedLabel = treeState.labeledRocks.find(label => label.treeNode === activeNode);
                if(associatedLabel){
                    associatedLabel.htmlLabel.style.display = 'block';
                }
            }
        }
    }

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.addEventListener("mousemove", pointerMove);
</script>
</body>
</html>
