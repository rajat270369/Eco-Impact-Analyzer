<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIA Project | Interactive Workspace</title>
    
    <style>
        body, html {
            background-color: #2f3257;
            background: linear-gradient(#2f3257, #3a1d2b);
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #previewHack {
            position: absolute;
            height: 100vh; 
            width: 100vw; /* Fixed from 100vh to cover entire browser viewport */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-image: url("https://raw.githubusercontent.com/ceramicSoda/treeshader/main/assets/preview.png");
            background-size: cover;
            background-position: center;
            z-index: 10;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>

    <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.3/dist/es-module-shims.js" crossorigin="anonymous"></script>
    <script type="importmap">
      {
        "imports": {      
          "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <div id="previewHack"></div>

    <script type="module">
        import * as THREE from "three";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";

        const leavesVS = /*glsl*/`
            uniform sampler2D uNoiseMap;
            uniform vec3 uBoxMin, uBoxSize, uRaycast;
            uniform float uTime;
            varying vec3 vObjectPos, vNormal, vWorldNormal; 
            varying float vCloseToGround;
            
            vec4 getTriplanar(sampler2D tex){
                vec4 xPixel = texture(tex, (vObjectPos.xy + uTime) / 3.);
                vec4 yPixel = texture(tex, (vObjectPos.yz + uTime) / 3.);
                vec4 zPixel = texture(tex, (vObjectPos.zx + uTime) / 3.);
                vec4 combined = (xPixel + yPixel + zPixel) / 6.0;
                combined.xyz = combined.xyz * vObjectPos; 
                return combined;
            }
            
            void main(){
                mat4 mouseDisplace = mat4(1.);
                vec3 vWorldPos = vec3(modelMatrix * instanceMatrix * mouseDisplace * vec4(position, 1.));
                vCloseToGround = clamp(vWorldPos.y, 0., 1.);
                float offset = clamp(0.8 - distance(uRaycast, instanceMatrix[3].xyz), 0., 999.); 
                offset = (pow(offset, 0.8) / 2.0) * vCloseToGround;
                mouseDisplace[3].xyz = vec3(offset);
                vNormal = normalMatrix * mat3(instanceMatrix) * mat3(mouseDisplace) * normalize(normal); 
                vWorldNormal = vec3(modelMatrix * instanceMatrix * mouseDisplace * vec4(normal, 0.));
                vObjectPos = ((vWorldPos - uBoxMin) * 2.) / uBoxSize - vec3(1.0); 
                vec4 noiseOffset = getTriplanar(uNoiseMap) * vCloseToGround; 
                vec4 newPos = instanceMatrix * mouseDisplace * vec4(position, 1.); 
                newPos.xyz = newPos.xyz + noiseOffset.xyz;
                gl_Position =  projectionMatrix * modelViewMatrix * newPos;
            }
        `;

        const leavesFS = /*glsl*/`
            #include <common> 
            #include <lights_pars_begin>
            uniform vec3 uColorA, uColorB, uColorC;
            uniform float uTime;
            varying vec3 vObjectPos, vNormal, vWorldNormal; 
            varying float vCloseToGround;
            
            vec3 mix3 (vec3 v1, vec3 v2, vec3 v3, float fa){
                vec3 m; 
                fa > 0.7 ? m = mix(v2, v3, (fa - .5) * 2.) : m = mix(v1, v2, fa * 2.);
                return m;
            }

            float getPosColors(){
                float p = 0.;
                p = smoothstep(0.2, 0.8, distance(vec3(0.), vObjectPos));
                p = p * (-(vWorldNormal.g / 2.) + 0.5) * (- vObjectPos.y / 9. + 0.5); 
                return p;
            }
            float getDiffuse(){
                float intensity = 0.0;
                for (int i = 0; i < directionalLights.length(); i++){
                    float dotProd = dot(directionalLights[i].direction, vNormal);
                    intensity += smoothstep(0.55, 1., dotProd) * 0.2 + pow(smoothstep(0.55, 1., dotProd), 0.5);
                }
                return intensity;
            }

            void main(){
                float gradMap = (getPosColors() + getDiffuse()) * vCloseToGround / 2. ;
                vec4 c = vec4(mix3(uColorA, uColorB, uColorC, gradMap), 1.0);
                gl_FragColor = vec4(pow(c.xyz,vec3(0.454545)), c.w);
            }
        `;

        // ENGINE SYSTEM SETUP
        const scene = new THREE.Scene();
        const loader = new GLTFLoader();
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        document.body.appendChild(renderer.domElement);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new OrbitControls(camera, renderer.domElement);
        const dummy = new THREE.Object3D();
        const matrix = new THREE.Matrix4();
        const pointer = new THREE.Vector2(); 
        const raycaster = new THREE.Raycaster();
        const dlight01 = new THREE.DirectionalLight(0xcccccc, 1.8);
        
        const tree = { group: new THREE.Group(), isLoaded: false };
        
        const noiseMap = new THREE.TextureLoader().load('https://raw.githubusercontent.com/ceramicSoda/treeshader/main/assets/noise.png');
        const poleTexture = new THREE.TextureLoader().load('https://raw.githubusercontent.com/ceramicSoda/treeshader/main/assets/texture.jpg');
        poleTexture.rotation = 100 * 0.01745329252;

        const rayPlane = new THREE.Mesh(new THREE.PlaneGeometry(100, 100, 1, 1), new THREE.MeshBasicMaterial({ visible: false }));

        // MATERIAL GENERATION
        const leavesMat = new THREE.ShaderMaterial({
            lights: true,
            side: THREE.DoubleSide,
            uniforms: {
                ...THREE.UniformsLib.lights,
                uTime: { value: 0. },
                uColorA: { value: new THREE.Color(0xb45252) },
                uColorB: { value: new THREE.Color(0xd3a068) },
                uColorC: { value: new THREE.Color(0xede19e) },
                uBoxMin: { value: new THREE.Vector3(0, 0, 0) },
                uBoxSize: { value: new THREE.Vector3(10, 10, 10) },
                uRaycast: { value: new THREE.Vector3(0, 0, 0) },
                uNoiseMap: { value: noiseMap },
            },
            vertexShader: leavesVS,
            fragmentShader: leavesFS,
        });

        // GLTF MODEL LOADER ROUTINE
        // GLOBAL REFRESH FOR MULTI-TREE ARRAY
const forest = [];

// GLTF MODEL LOADER ROUTINE (REFACTORED FOR CLONING)
loader.loadAsync("https://raw.githubusercontent.com/ceramicSoda/treeshader/main/assets/tree.glb")
.then(obj => {
    const preview = document.getElementById("previewHack");
    if(preview) preview.style.display = "none";

    // Extract base components from the loaded template
    const basePole = obj.scene.getObjectByName("Pole");
    basePole.material = new THREE.MeshToonMaterial({ map: basePole.material.map || poleTexture });
    
    const baseCrown = obj.scene.getObjectByName("Leaves");
    const baseLeafGeo = obj.scene.getObjectByName("Leaf").geometry;
    
    // Calculate bounding box for the shader
    tree.bbox = new THREE.Box3().setFromObject(baseCrown);
    leavesMat.uniforms.uBoxMin.value.copy(tree.bbox.min); 
    leavesMat.uniforms.uBoxSize.value.copy(tree.bbox.getSize(new THREE.Vector3())); 

    // Setup transformation parameters for 4 distinct forest nodes
    const treeConfigs = [
        { name: "Mother_Tree", pos: new THREE.Vector3(0, 0, 0), scale: 1.0, rotY: 0 },
        { name: "Satellite_Alpha", pos: new THREE.Vector3(-5, -0.2, 4), scale: 0.65, rotY: Math.PI * 0.25 },
        { name: "Satellite_Beta", pos: new THREE.Vector3(5, -0.2, 4), scale: 0.65, rotY: Math.PI * 0.75 },
        { name: "Satellite_Gamma", pos: new THREE.Vector3(0, -0.2, -6), scale: 0.65, rotY: -Math.PI * 0.5 }
    ];

    treeConfigs.forEach((config) => {
        const treeGroup = new THREE.Group();
        treeGroup.name = config.name;
        treeGroup.position.copy(config.pos);
        treeGroup.scale.setScalar(config.scale);
        treeGroup.rotation.y = config.rotY;

        // Clone the trunk structure safely
        const poleClone = basePole.clone();
        treeGroup.add(poleClone);

        // Reconstruct instance matrix data for the leaves
        const leavesCount = baseCrown.geometry.attributes.position.count;
        const instancedLeaves = new THREE.InstancedMesh(baseLeafGeo, leavesMat, leavesCount);

        for (let i = 0; i < leavesCount; i++) { 
            dummy.position.x = baseCrown.geometry.attributes.position.array[i*3];
            dummy.position.y = baseCrown.geometry.attributes.position.array[i*3+1];
            dummy.position.z = baseCrown.geometry.attributes.position.array[i*3+2];
            
            dummy.lookAt(
                dummy.position.x + baseCrown.geometry.attributes.normal.array[i*3],
                dummy.position.y + baseCrown.geometry.attributes.normal.array[i*3+1],
                dummy.position.z + baseCrown.geometry.attributes.normal.array[i*3+2]
            );
            
            dummy.scale.set(
                (Math.random() * 0.2 + 0.8),
                (Math.random() * 0.2 + 0.8),
                (Math.random() * 0.2 + 0.8)
            );
            dummy.updateMatrix();
            instancedLeaves.setMatrixAt(i, dummy.matrix);
        }

        treeGroup.add(instancedLeaves);
        scene.add(treeGroup);
        
        // Track the tree object for clicking/raycasting later
        forest.push({
            group: treeGroup,
            leavesMesh: instancedLeaves,
            config: config
        });
    });

    // Setup global falling leaf registry using the central tree parameters
    tree.leavesCount = baseCrown.geometry.attributes.position.count;
    tree.leaves = forest[0].leavesMesh; // Track mother tree leaves for ambient drops
    tree.deadID = [];
    for (let i = 0; i < 24; i++) {
        tree.deadID.push(Math.floor(Math.random() * tree.leavesCount)); 
    }

    tree.isLoaded = true;
    killRandom();
})
.catch(err => console.error("Error building forest ecosystem:", err));

        // INITIAL ENVIRONMENT ENVIRONMENT VALUES
        dlight01.position.set(5, 12, -5);
        camera.position.set(-12, 7, -16); // Pulled further back and higher up to view the grove
        controls.target = new THREE.Vector3(0, 1.5, 0); // Focus closer to center ground
        controls.maxPolarAngle = Math.PI * 0.5; 
        controls.minDistance = 4.0;   // Hard cap: Prevents zooming inside the trunk/branches
        controls.maxDistance = 25.0;  // Hard cap: Prevents zooming out infinitely into the void
        // --------------------------------------
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.enablePan = false;
        
        scene.add(dlight01, tree.group, rayPlane);
        
        noiseMap.wrapS = THREE.RepeatWrapping;
        noiseMap.wrapT = THREE.RepeatWrapping;

        // ANIMATION LOOP
        function animate () {
            requestAnimationFrame(animate);
            leavesMat.uniforms.uTime.value += 0.01; 

            if (tree.isLoaded && tree.deadID) {
                tree.deadID = tree.deadID.map(i => {
                    if (i === undefined) return undefined;
                    tree.leaves.getMatrixAt(i, matrix);
                    matrix.decompose(dummy.position, dummy.rotation, dummy.scale);
                    
                    if (dummy.position.y > 0) {
                        dummy.position.y -= 0.04;
                        dummy.position.x += Math.random()/5 - 0.11;
                        dummy.position.z += Math.random()/5 - 0.11;
                        dummy.rotation.x += 0.2;
                        dummy.updateMatrix();
                        tree.leaves.setMatrixAt(i, dummy.matrix);
                        return i;
                    }
                    return undefined;
                }).filter(val => val !== undefined);
                
                tree.leaves.instanceMatrix.needsUpdate = true; 
            } 

            controls.update(); 
            renderer.render(scene, camera); 
        }
        animate();

        // DECAY SIMULATOR (SAFE RECURSION)
        function killRandom() {
            if (!tree.isLoaded) return;
            if (tree.deadID) {
                tree.deadID.push(Math.floor(Math.random() * tree.leavesCount)); 
            }
            setTimeout(killRandom, Math.random() * 1500);
        }

        // POINTER LOOKUP PARSING
        function pointerMove(e) {
            pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(pointer, camera);
            
            if (!tree.isLoaded) return;
            const intersects = raycaster.intersectObjects([tree.leaves, rayPlane]);
            
            if (intersects[0]) {
                rayPlane.position.copy(intersects[0].point);
                rayPlane.position.multiplyScalar(0.9);
                rayPlane.lookAt(camera.position);
                leavesMat.uniforms.uRaycast.value = intersects[0].point;
                if (Math.random() * 5 > 3 && intersects[0].instanceId !== undefined) {
                    tree.deadID.push(intersects[0].instanceId);
                }
            }
        }

        // SYSTEM RESIZE HANDLER
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.addEventListener("mousemove", pointerMove);
    </script>
</body>
</html>
